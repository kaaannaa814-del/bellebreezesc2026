<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team - Summer Camp 2026</title>
    <!-- 手書き風フォント Caveat と Noto Serif JP を読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif JP', serif;
            /* スケジュール画面と共通のパステルブルー＆パープルのやわらかいグラデーション背景 */
            background-color: #e3f2fd;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.7) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(225, 210, 255, 0.6) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 60px;
        }

        /* 戻るボタン */
        .back-btn {
            align-self: flex-start;
            text-decoration: none;
            color: #5b628f;
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.2s;
        }
        .back-btn:active {
            transform: translateX(-3px);
        }

        /* タイトル */
        h1 {
            font-family: 'Caveat', cursive;
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #2b2b2b;
            text-align: center;
            position: relative;
        }

        /* タイトルのアクセント斜線 */
        h1::after {
            content: '///';
            position: absolute;
            top: -8px;
            right: -32px;
            font-size: 1.2rem;
            color: #b892ff;
            letter-spacing: -2px;
            transform: rotate(15deg);
        }

        /* チーム紹介カード全体のコンテナ */
        .team-container {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 各チームのカード（スケジュール画面と共通のカードデザイン） */
        .team-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 26px 24px;
            box-shadow: 0 10px 30px rgba(138, 149, 190, 0.15);
            position: relative;
            border: 2px dashed #dbeafe;
        }

        /* チーム名ヘッダー */
        .team-title {
            font-family: 'Caveat', cursive;
            font-size: 2.2rem;
            font-weight: 700;
            color: #4a5568;
            padding-bottom: 10px;
            margin-bottom: 18px;
            position: relative;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* チーム名の下のグラデーションライン */
        .team-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, #a2d2ff, #b5838d, #c8b6ff);
            border-radius: 2px;
        }

        /* メンバーリスト */
        .member-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-left: 4px;
        }

        .member-item {
            font-size: 0.95rem;
            font-weight: 700;
            color: #333333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* リストのアイコン（パステルブルーの丸ポチ風） */
        .member-item::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #a2d2ff;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- 戻るボタン -->
    <a href="menu.html" class="back-btn">‹ Back</a>

    <h1>Team</h1>

    <div class="team-container">
        <!-- チーム1 -->
        <div class="team-card">
            <div class="team-title">Team A</div>
            <ul class="member-list">
                <li class="member-item">メンバー名前 1</li>
                <li class="member-item">メンバー名前 2</li>
                <li class="member-item">メンバー名前 3</li>
            </ul>
        </div>

        <!-- チーム2 -->
        <div class="team-card">
            <div class="team-title">Team B</div>
            <ul class="member-list">
                <li class="member-item">メンバー名前 1</li>
                <li class="member-item">メンバー名前 2</li>
                <li class="member-item">メンバー名前 3</li>
            </ul>
        </div>

        <!-- チーム3 -->
        <div class="team-card">
            <div class="team-title">Team C</div>
            <ul class="member-list">
                <li class="member-item">メンバー名前 1</li>
                <li class="member-item">メンバー名前 2</li>
                <li class="member-item">メンバー名前 3</li>
            </ul>
        </div>
    </div>

</body>
</html>
