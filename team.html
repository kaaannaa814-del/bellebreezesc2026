<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEAM</title>
    <!-- Googleフォント（M PLUS Rounded 1c） -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4 portrait;
            margin: 10mm;
            background-color: #f0f7ff;
        }
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 15px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            color: #444;
            /* お手本に合わせた爽やかで可愛いパステルブルーのグラデーション背景 */
            background: linear-gradient(135deg, #e4f1fe 0%, #f4f9ff 100%);
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        /* タイトル部分 (CONTENTSのフォントスタイルと三本線装飾) */
        .header-wrapper {
            position: relative;
            text-align: center;
            margin-bottom: 22px;
            padding-top: 15px;
        }
        .header-title {
            display: inline-block;
            font-size: 44px;
            font-style: italic;
            font-weight: 800;
            color: #333;
            letter-spacing: 3px;
        }
        /* 右上の紫の三本線 */
        .deco-lines {
            position: absolute;
            top: 5px;
            right: 28%;
            width: 24px;
            height: 18px;
        }
        .deco-lines line {
            stroke: #b19ffb;
            stroke-width: 3.5;
            stroke-linecap: round;
        }

        /* 全体のベース枠（白くて丸いフェルト風） */
        .board-section {
            background: rgba(255, 255, 255, 0.75);
            border-radius: 26px;
            padding: 14px;
            margin-bottom: 14px;
            border: 2.5px dashed #ffffff;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.03);
        }
        .grid-3 {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
        .grid-3-col {
            display: table-cell;
            width: 33.333%;
            padding: 0 5px;
            vertical-align: top;
        }
        .grid-2 {
            display: table;
            width: 72%;
            margin: 0 auto;
            table-layout: fixed;
        }
        .grid-2-col {
            display: table-cell;
            width: 50%;
            padding: 0 8px;
            vertical-align: top;
        }
        .team-column {
            display: block;
        }
        
        /* チームのヘッダー部分 */
        .team-header {
            text-align: center;
            font-size: 19px;
            font-weight: 800;
            padding: 5px;
            border-radius: 14px 14px 6px 6px;
            margin-bottom: 6px;
        }

        /* お手本のボタンに合わせた、可愛い丸みと白いステッチ風のカード */
        .member-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 6px 9px;
            font-size: 11.5px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 6px;
            min-height: 26px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            position: relative;
        }
        .member-card div {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* チームごとのカラー設定（お手本のボタン色と完全一致） */
        /* Team A: ピンク */
        .team-a .team-header { color: #ff6b8b; background: #ffccd5; border: 2px dashed #fff; }
        .team-a .member-card { border: 2px dashed #ffccd5; }

        /* Team B: グリーン（一番下のteamボタン色） */
        .team-b .team-header { color: #1abc9c; background: #d1f2eb; border: 2px dashed #fff; }
        .team-b .member-card { border: 2px dashed #d1f2eb; }

        /* Team C: ブルー */
        .team-c .team-header { color: #3498db; background: #d4e6f1; border: 2px dashed #fff; }
        .team-c .member-card { border: 2px dashed #d4e6f1; }

        /* Team D: オレンジ（itemsボタンの色） */
        .team-d .team-header { color: #f39c12; background: #fdebd0; border: 2px dashed #fff; }
        .team-d .member-card { border: 2px dashed #fdebd0; }

        /* Team E: パープル（scheduleボタンの色） */
        .team-e .team-header { color: #9b59b6; background: #e8daef; border: 2px dashed #fff; }
        .team-e .member-card { border: 2px dashed #e8daef; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <div class="header-wrapper">
            <svg class="deco-lines" viewBox="0 0 24 18">
                <line x1="2" y1="16" x2="8" y2="2" />
                <line x1="9" y1="16" x2="15" y2="2" />
                <line x1="16" y1="16" x2="22" y2="2" />
            </svg>
            <div class="header-title">TEAM</div>
        </div>

        <div class="board-section">
            <div class="grid-3">
                <div class="grid-3-col">
                    <div class="team-column team-a">
                        <div class="team-header">A</div>
                        <div class="member-card"><div>・まい</div></div>
                        <div class="member-card"><div>・はらりく</div></div>
                        <div class="member-card"><div>・みさき</div><div>・みお</div><div>・たまき</div></div>
                        <div class="member-card"><div>・しょうや</div><div>・たつき</div></div>
                        <div class="member-card"><div>・さやか</div><div>・ななみ</div></div>
                        <div class="member-card"><div>・大介</div><div>・みか</div></div>
                    </div>
                </div>
                <div class="grid-3-col">
                    <div class="team-column team-b">
                        <div class="team-header">B</div>
                        <div class="member-card"><div>・ゆう</div></div>
                        <div class="member-card"><div>・がく</div><div>・れん</div></div>
                        <div class="member-card"><div>・あいり</div><div>・すぎみん</div></div>
                        <div class="member-card"><div>・宮内陽向</div><div>・ごたんだ</div></div>
                        <div class="member-card"><div>・ヒカル</div><div>・ちさこ</div></div>
                        <div class="member-card"><div>・もえ</div><div>・ゆうだ</div></div>
                    </div>
                </div>
                <div class="grid-3-col">
                    <div class="team-column team-c">
                        <div class="team-header">C</div>
                        <div class="member-card"><div>・ひびき</div></div>
                        <div class="member-card"><div>・そら</div><div>・たける</div></div>
                        <div class="member-card"><div>・なまき</div><div>・ひいろ</div></div>
                        <div class="member-card"><div>・ゆうた</div><div>・宮内陽光</div></div>
                        <div class="member-card"><div>・しおね</div><div>・あや</div><div>・ももか</div></div>
                        <div class="member-card"><div>・じんない</div><div>・長崎</div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="board-section">
            <div class="grid-2">
                <div class="grid-2-col">
                    <div class="team-column team-d">
                        <div class="team-header">D</div>
                        <div class="member-card"><div>・はるな</div><div>・さなみ</div></div>
                        <div class="member-card"><div>・りょう</div><div>・たいが</div></div>
                        <div class="member-card"><div>・悠お</div><div>・はるか</div></div>
                        <div class="member-card"><div>・いなむー</div><div>・津田陽向</div></div>
                        <div class="member-card"><div>・はるな</div><div>・みなみ</div></div>
                        <div class="member-card"><div>・ゆい</div><div>・ゆうだい</div></div>
                    </div>
                </div>
                <div class="grid-2-col">
                    <div class="team-column team-e">
                        <div class="team-header">E</div>
                        <div class="member-card"><div>・かな</div><div>・さやか</div></div>
                        <div class="member-card"><div>・しゅうた</div></div>
                        <div class="member-card"><div>・あいり</div><div>・かえで</div></div>
                        <div class="member-card"><div>・ゆうせい</div></div>
                        <div class="member-card"><div>・ゆづき</div><div>・みわこ</div></div>
                        <div class="member-card"><div>・いつき</div><div>・こうせい</div><div>・たまき</div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
