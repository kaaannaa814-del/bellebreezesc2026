<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Summer Camp 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif JP', serif;
            background-color: #f4f1ea;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-size: 3.5rem;
            margin-bottom: 30px;
            color: #2c3e50;
        }

        .menu-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            background-color: #ffffff;
            color: #2c3e50;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
            border: 2px solid #e0dcd3;
            transition: all 0.2s ease;
        }

        .menu-btn:active {
            transform: scale(0.98);
            background-color: #2c3e50;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>INDEX</h1>

    <div class="menu-container">
        <a href="schedule.html" class="menu-btn">point</a>
        <a href="access.html" class="menu-btn">schedule</a>
        <a href="belongings.html" class="menu-btn">items</a>
        <a href="member.html" class="menu-btn">team</a>
    </div>

</body>
</html>
