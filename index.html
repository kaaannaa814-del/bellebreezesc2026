<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Summer Camp 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Baloo 2',cursive;
    background:#000;
}

/* 背景 */

.hero{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* タイトル */

.title{
    position:absolute;
    top:8%;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    text-align:center;
    z-index:10;
    color:#fff;
}

.title h1{

    font-weight:800;
    line-height:.82;
    letter-spacing:1px;

    text-shadow:
        0 3px 0 rgba(0,0,0,.2),
        0 8px 20px rgba(0,0,0,.35),
        0 0 12px rgba(255,255,255,.3);

    opacity:0;
    animation:fadeUp 1s forwards;
}

.summer{
    font-size:9rem;
}

.camp{
    font-size:9rem;
    margin-top:-35px;
    animation-delay:.3s;
}

.year{
    font-size:8rem;
    margin-left:8px;
}

/* アニメーション */

@keyframes fadeUp{

from{
    opacity:0;
    transform:translateY(40px);
}

to{
    opacity:1;
    transform:translateY(0);
}

}

/* スマホ */

@media(max-width:768px){

.title{
    top:12%;
}

.summer{
    font-size:5.8rem;
}

.camp{
    font-size:5.8rem;
    margin-top:-18px;
}

.year{
    font-size:5rem;
}

}

</style>

</head>

<body>

<div class="hero">

<img src="sc81215.jpg" alt="Summer Camp">

<div class="title">

<h1 class="summer">
Summer
</h1>

<h1 class="camp">
Camp<span class="year">2026</span>
</h1>

</div>

</div>

</body>
</html>
