<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summer Camp 2026</title>
  <style>
    /* ベース設定 */
    html {
      font-size: 62.5%; /* 1rem = 10px 計算にしやすくするための設定 */
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: sans-serif;
      display: flex;
      gap: 16px;
      align-items: baseline;
    }

    /* 文字サイズの個別指定 */
    .summer-text {
      font-size: 4.4rem;
    }

    .camp-text,
    .year-text {
      font-size: 4.8rem;
    }
  </style>
</head>
<body>

  <span class="summer-text">Summer</span>
  <span class="camp-text">Camp</span>
  <span class="year-text">2026</span>

</body>
</html>
