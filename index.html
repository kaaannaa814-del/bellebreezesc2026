<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Camp 2026</title>
    <!-- 手書き風フォントの読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* 基本リセット */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Noto Serif JP', serif;
        }

        /* リンクの装飾解除 */
        .hero-link {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
            color: inherit;
        }

        /* 画面全体のコンテナ */
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 背景画像 */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center bottom;
            z-index: 1;
        }

        /* 背景の上に載せる文字レイヤー */
        .content-overlay {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #ffffff;
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.7);
            padding: 20px;
            width: 100%;
            transform: translateY(-42px);
        }

        /* アニメーション共通設定 */
        .animated-item {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* タイトル全体エリア */
        .title-area {
            display: inline-block;
        }

        /* タイトルデザイン */
        .main-title {
            font-family: 'Caveat', cursive;
            font-size: 6rem;
            line-height: 0.85;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .sub-title-container {
            display: flex;
            justify-content: center;
            align-items: baseline;
            margin-top: 5px;
        }

        .sub-title {
            font-size: 6.2rem;
            line-height: 1;
            letter-spacing: 3px;
        }

        .year {
            font-size: 4.6rem;
            margin-left: 20px;
            letter-spacing: 2px;
            transform: translateY(-2px) rotate(-2deg);
            display: inline-block;
        }

        /* スマホ対応 */
        @media (max-width: 480px) {
            .content-overlay {
                transform: translateY(-47px);
            }
            .main-title {
                font-size: 4.6rem;
                letter-spacing: 3px;
            }
            .sub-title {
                font-size: 4.8rem;
                letter-spacing: 2px;
            }
            .year {
                font-size: 3.5rem;
                margin-left: 18px;
                transform: translateY(-2px) rotate(-2deg);
            }
        }
    </style>
</head>
<body>

    <!-- タップで menu.html に移動 -->
    <a href="menu.html" class="hero-link">
        <div class="hero-container">
            <img src="sc81215.jpg" alt="背景画像" class="bg-image">

            <div class="content-overlay">
                <div class="title-area">
                    <h1 class="main-title animated-item" style="animation-delay: 0.3s;">Summer</h1>
                    <div class="sub-title-container animated-item" style="animation-delay: 0.8s;">
                        <span class="main-title sub-title">Camp</span>
                        <span class="main-title year">2026</span>
                    </div>
                </div>
            </div>
        </div>
    </a>

</body>
</html>
