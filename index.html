<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer Camp 2026</title>
    <!-- 手書き風フォントの読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* 基本リセット */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Noto Serif JP', serif;
        }

        /* 画面全体のコンテナ */
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 背景画像 */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center bottom;
            z-index: 1;
        }

        /* 背景の上に載せる文字レイヤー */
        .content-overlay {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #ffffff;
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.7);
            padding: 20px;
            width: 100%;
            
            /* 全体をさらに少し上に引き上げ */
            transform: translateY(-55px);
        }

        /* アニメーション共通設定 */
        .animated-item {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* 下からふわっと浮き上がるアニメーション */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* タイトルデザイン */
        .main-title {
            font-family: 'Caveat', cursive;
            font-size: 5.8rem;
            line-height: 0.95;
            font-weight: 700;
        }

        .sub-title-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -5px;
        }

        .sub-title {
            font-size: 5.2rem;
            line-height: 1;
        }

        /* 2026の文字：葉っぱの枠に収まるようサイズ調整 */
        .year {
            font-size: 3.2rem;
            margin-left: 12px;
            letter-spacing: 2px; /* 数字の間隔をほんのり整える */
            transform: translateY(2px); /* 葉っぱの高さに微調整 */
            display: inline-block;
        }

        /* スマホ対応（iPhoneの画面幅向け） */
        @media (max-width: 480px) {
            .content-overlay {
                transform: translateY(-65px); /* スマホでより適切な上位置へ */
            }
            .main-title {
                font-size: 4.2rem;
            }
            .sub-title {
                font-size: 3.8rem;
            }
            .year {
                font-size: 2.2rem; /* 葉っぱの間にちょうどハマるサイズ */
                margin-left: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- 画面の背景写真 -->
        <img src="sc81215.jpg" alt="背景画像" class="bg-image">

        <!-- 浮き上がる文字エリア -->
        <div class="content-overlay">

            <!-- Summer Camp 2026 -->
            <div class="title-area">
                <h1 class="main-title animated-item" style="animation-delay: 0.3s;">Summer</h1>
                <div class="sub-title-container animated-item" style="animation-delay: 0.8s;">
                    <span class="main-title sub-title">Camp</span>
                    <span class="main-title year">2026</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
